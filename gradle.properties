# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
APP_VERSION_NAME=0.7.6-beta2
APP_VERSION_CODE=11
org.gradle.configuration-cache=true
# Build cache: reuses task outputs across builds and across clean/rebuild cycles.
# Matters here because the Windows file-lock problem forces frequent `rm -rf app/build`
# wipes — without this, every one of those costs a full cold rebuild.
org.gradle.caching=true
# Adjusted to stay within 3GB limit and avoid thrashing
# Increased heap to 4GB and Metaspace to 1024m to prevent memory exhaustion
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefParsingEnabled
org.gradle.workers.max=6
org.gradle.parallel=true

androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY,THERMAL

# R8 Full Mode is generally recommended to be enabled unless there are specific issues.
# This is one of those issues: with full mode on, the release build installs fine and then
# dies on launch with a ClassCastException inside Hilt's generated provider graph —
#   MainActivity.onStart -> HiltViewModelFactory
#     -> DaggerPixelPlayApplication_HiltComponents$ViewModelCImpl$SwitchingProvider
#       -> ActivityRetainedComponentManager_LifecycleModule_ProvideActivityRetainedLifecycleFactory
# Full mode's class merging + unchecked-cast elimination breaks Dagger's SwitchingProvider
# pattern, which dispatches many bindings from one class through an int switch and relies on
# those casts. Non-full R8 still shrinks, obfuscates and optimises; the startup win here comes
# overwhelmingly from R8 + the baseline profile, not from full mode's extra passes.
android.enableR8.fullMode=false

# Aligning with AGP 9.2+ defaults and removing deprecated settings
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.enableAppCompileTimeRClass=true
# LiteRT 2.2.0's required litert and litert-api AARs share Google's manifest namespace.
# Allow their published metadata until Google gives the artifacts unique namespaces.
android.uniquePackageNames=false
android.usesSdkInManifest.disallowed=true
android.r8.optimizedResourceShrinking=true
android.defaults.buildfeatures.resvalues=false

# Cleanup of other non-essential/deprecated flags
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=true

android.builtInKotlin=true
android.newDsl=true
ksp.useKSP2=true

