name: Android CI

# Compiles, unit-tests and builds a debug APK on every push to any branch and on every pull
# request, so a broken build shows up as a red X on the commit instead of weeks later.
# Docs-only pushes (handoff notes, docs, Markdown) are skipped.
# The arm64 debug APK of each run is kept for 14 days under the run's "Artifacts".
#
# Built-in cloud keys: the Gradle steps get the CLOUD_DEFAULTS_KEY secret (the AES key that opens
# app/src/main/assets/cloud_defaults.enc) and put it into BuildConfig. Pull requests from forks get no secrets, so
# there it is empty and the build simply has no built-in keys (it still compiles, tests and builds).
# Heads-up: the key therefore ends up inside the APK artifact below, which anyone who can see this repository's
# Actions can download. That is the same exposure as any shipped APK (see handoff/2026-10-08-android-builtin-keys.md).

on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'handoff/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile app (debug)
        env:
          CLOUD_DEFAULTS_KEY: ${{ secrets.CLOUD_DEFAULTS_KEY }}
        run: ./gradlew :app:compileDebugKotlin

      - name: Unit tests
        env:
          CLOUD_DEFAULTS_KEY: ${{ secrets.CLOUD_DEFAULTS_KEY }}
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile Wear OS app (debug)
        run: ./gradlew :wear:compileDebugKotlin

      - name: Build debug APKs
        env:
          CLOUD_DEFAULTS_KEY: ${{ secrets.CLOUD_DEFAULTS_KEY }}
        run: ./gradlew :app:assembleDebug -Ppixelplay.enableAbiSplits=true

      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pixlaudio-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
