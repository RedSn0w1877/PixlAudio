name: Schema peek (temporary)

# Temporary: prints the Room schema Room exports for the main database so it can be committed.
# Removed again in the next commit of this branch.
on:
  push:
    branches: [ 'brain-search-history' ]

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Export the schema
        run: ./gradlew :app:kspDebugKotlin
      - name: Print schema 6
        run: |
          ls app/schemas/com.theveloper.pixelplay.data.database.PixelPlayDatabase/
          echo "-----BEGIN SCHEMA-----"
          cat app/schemas/com.theveloper.pixelplay.data.database.PixelPlayDatabase/6.json
          echo "-----END SCHEMA-----"
