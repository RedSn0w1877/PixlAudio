name: Build Phone APK (Release)

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phone:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # One signing key for every build, so a new APK always installs over the old one. The key lives in the
      # ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets (a backup copy is on Hoa's PC). Forks and bot PRs have no
      # secrets and fall back to the throwaway key below, which changes whenever its cache is evicted.
      - name: Use the permanent signing key
        id: permanent-key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            printf '%s' "$KS_B64" | base64 -d > vz-pixelplay.jks
            {
              echo "storePassword=$KS_PW"
              echo "keyAlias=pixelplay-key"
              echo "keyPassword=$KS_PW"
            } > keystore.properties
            echo "used=true" >> "$GITHUB_OUTPUT"
          else
            echo "No permanent signing key in this run (no secrets): using the throwaway cached key."
            echo "used=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache keystore
        id: cache-keystore
        if: steps.permanent-key.outputs.used != 'true'
        uses: actions/cache@v6
        with:
          path: vz-pixelplay.jks
          key: ${{ runner.os }}-keystore-vz-pixelplay


# This is not the official release key, those apk's will be universal and manually uploaded.
      - name: Generate keystore if not cached
        if: steps.permanent-key.outputs.used != 'true' && steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore vz-pixelplay.jks -alias pixelplay-key -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass 994273 -keypass 994273 \
            -dname "CN=PixelPlay, OU=Dev, O=PixelPlay, L=World, S=World, C=US"

      - name: Create keystore.properties
        if: steps.permanent-key.outputs.used != 'true'
        run: |
          echo "storePassword=994273" > keystore.properties
          echo "keyAlias=pixelplay-key" >> keystore.properties
          echo "keyPassword=994273" >> keystore.properties

      - name: Build Phone release APK
        env:
          CLOUD_DEFAULTS_KEY: ${{ secrets.CLOUD_DEFAULTS_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: gradle :app:assembleRelease -Ppixelplay.enableAbiSplits=true

      - name: Verify Phone split APKs
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          done

      - name: Upload Phone split APK artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PixelPlay-phone-release-split-apks
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          compression-level: 0
